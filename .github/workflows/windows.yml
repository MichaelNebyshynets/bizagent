name: Windows installer
on:
  pull_request:
    branches: [develop]
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.10.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: python -m pip install -r packaging/windows/requirements.lock
      - working-directory: bizagent
        run: python -m pytest -q
      - run: ./packaging/windows/build.ps1 -Output "$env:RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: BizAgent-Windows-x64
          path: ${{ runner.temp }}/dist/*
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet && docker compose build
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BizAgent-Windows-x64
      - run: sha256sum --check BizAgent-Setup.exe.sha256
      - run: gh release create "$GITHUB_REF_NAME" BizAgent-Setup.exe BizAgent-Setup.exe.sha256 --verify-tag --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
