name: Windows installer
on:
  pull_request:
    branches: [develop]
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.10.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: python -m pip install -r packaging/windows/requirements.lock
      - working-directory: bizagent
        run: python -m pytest -q
      - run: ./packaging/windows/build.ps1 -Output "$env:RUNNER_TEMP/dist"
      - name: Verify installed application with PostgreSQL and live Ollama
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "installed"
          $p = Start-Process -Wait -PassThru -WindowStyle Hidden "$env:RUNNER_TEMP/dist/BizAgent-Setup.exe" -ArgumentList "/VERYSILENT /NORESTART /DIR=`"$destination`""
          if ($p.ExitCode) { throw "Installation failed $($p.ExitCode)" }
          & "$destination/python/python.exe" -X utf8 packaging/windows/verify_install.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process -Wait -PassThru -WindowStyle Hidden "$destination/unins000.exe" -ArgumentList "/VERYSILENT /NORESTART"
          if ($p.ExitCode -or !(Test-Path "$env:LOCALAPPDATA/BizAgent/data/postgres/PG_VERSION")) { throw "Uninstall persistence failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: BizAgent-Windows-x64
          path: ${{ runner.temp }}/dist/*
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet && docker compose build
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BizAgent-Windows-x64
      - run: sha256sum --check BizAgent-Setup.exe.sha256
      - run: gh release create "$GITHUB_REF_NAME" BizAgent-Setup.exe BizAgent-Setup.exe.sha256 --verify-tag --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
